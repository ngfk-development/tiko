[workspace]
resolver = "2"
members = [
    "crates/tiko-api",
    "crates/tiko-cli",
    "crates/tiko-database",
    "crates/tiko-providers",
    "crates/tiko-sync"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_path_to_error = "0.1"
sqlx = { version = "0.9.0", features = ["chrono", "json", "migrate", "postgres", "runtime-tokio", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.23.3", features = ["serde", "v4"] }
